# Build multi-platform wheels, attach them to a GitHub Release, and mirror
# them to the family Gitea PyPI index when configured.
#
# PyPI itself is intentionally not configured yet — GitHub Releases + the
# internal registry only. The mirror is gated on vars/secrets so a fork or a
# clean clone is unaffected.

name: Publish

on:
  push:
    tags: ["v*.*.*", "!v0.0.0"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build wheels without creating a GitHub Release
        type: boolean
        default: true
      mirror:
        description: Publish built wheels to the family Gitea index
        type: boolean
        default: false

permissions: {}

jobs:
  preflight:
    # Decides whether the Gitea mirror is configured, and publishes that as an
    # OUTPUT rather than letting the mirror job test it directly.
    #
    # The `secrets` context is NOT available in a job-level `if:` — only
    # github, needs, vars and inputs are. So `if: secrets.FOO != ''` does not
    # error; it evaluates empty and SILENTLY SKIPS the job. Read the secret in
    # a step `env` and reduce it to a boolean instead.
    name: preflight
    runs-on: ubuntu-latest
    outputs:
      mirror_enabled: ${{ steps.check.outputs.mirror_enabled }}
    steps:
      - name: is the Gitea mirror configured?
        id: check
        env:
          MIRROR_URL: ${{ vars.PYPI_CUSTOM_URL }}
          MIRROR_USER: ${{ secrets.PYPI_CUSTOM_USERNAME }}
          MIRROR_TOKEN: ${{ secrets.PYPI_CUSTOM_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${MIRROR_URL}" ] && [ -n "${MIRROR_USER}" ] && [ -n "${MIRROR_TOKEN}" ]; then
            echo "mirror_enabled=true" >> "$GITHUB_OUTPUT"
            echo "mirror configured at ${MIRROR_URL}"
          else
            echo "mirror_enabled=false" >> "$GITHUB_OUTPUT"
            echo "mirror not configured, skipping it:" \
                 "url:${MIRROR_URL:+set} user:${MIRROR_USER:+set} token:${MIRROR_TOKEN:+set}"
          fi

  version-gate:
    name: version gate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Cargo.toml and pyproject.toml versions must match
        id: ver
        run: |
          set -euo pipefail
          cargo_ver=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          py_ver=$(sed -n 's/^version = "\([^"]*\)"/\1/p' pyproject.toml | head -1)
          if [ "$cargo_ver" != "$py_ver" ]; then
            echo "::error::Cargo.toml ($cargo_ver) != pyproject.toml ($py_ver)"
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$cargo_ver" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match package version $cargo_ver"
              exit 1
            fi
          fi
          echo "version=${cargo_ver}" >> "$GITHUB_OUTPUT"
          echo "package version ${cargo_ver}"

  linux:
    name: wheel · linux-${{ matrix.target }}
    needs: [version-gate]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: build manylinux wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: "2_17"
      - name: build musllinux wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: musllinux_1_2
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist/*

  macos:
    name: wheel · macos-${{ matrix.target }}
    needs: [version-gate]
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist/*

  windows:
    name: wheel · windows-x64
    needs: [version-gate]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64
      - uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-x64
          path: dist/*

  sdist:
    name: sdist
    needs: [version-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist/*

  smoke:
    name: smoke install
    needs: [linux, sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheels-linux-x86_64
          merge-multiple: true
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.11.6"
          python-version: "3.11"
      - name: install manylinux wheel and round-trip
        run: |
          set -euo pipefail
          wheel=$(ls dist/l3io_age_passphrase-*-manylinux*.whl | grep -v musllinux | head -1)
          echo "using $wheel"
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python "$wheel"
          /tmp/smoke/bin/python - <<'PY'
          import io
          from l3io_age_passphrase import encrypt_io, decrypt_io
          plain = b"smoke\n" * 100
          out = io.BytesIO()
          encrypt_io(io.BytesIO(plain), out, "smoke-secret")
          back = io.BytesIO()
          decrypt_io(io.BytesIO(out.getvalue()), back, "smoke-secret")
          assert back.getvalue() == plain
          print("smoke ok")
          PY

  # Deliberately does NOT gate github-release. A registry problem must not
  # cost a GitHub Release (same independence as l3io-wordpress-database).
  publish-mirror:
    name: mirror to family index
    needs: [linux, macos, windows, sdist, smoke, preflight]
    if: >-
      needs.preflight.outputs.mirror_enabled == 'true' &&
      (startsWith(github.ref, 'refs/tags/v') ||
       (github.event_name == 'workflow_dispatch' && inputs.mirror))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.11.6"
      - name: list artifacts
        run: ls -la dist/
      - name: which files are already on the registry?
        # Multi-platform package: skip files already present and upload only
        # the missing ones. `uv publish --check-url` does not receive the
        # publish credentials, so it cannot do this itself.
        id: missing
        env:
          MIRROR_URL: ${{ vars.PYPI_CUSTOM_URL }}
          MIRROR_USER: ${{ secrets.PYPI_CUSTOM_USERNAME }}
          MIRROR_TOKEN: ${{ secrets.PYPI_CUSTOM_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/to-publish
          code=$(curl -sS -o /tmp/simple.html -w '%{http_code}' \
                   -u "${MIRROR_USER}:${MIRROR_TOKEN}" \
                   "${MIRROR_URL%/}/simple/l3io-age-passphrase/" || echo "000")
          echo "simple index HTTP ${code}"
          count=0
          for path in dist/*; do
            [ -f "$path" ] || continue
            base=$(basename "$path")
            if [ "$code" = "200" ] && grep -qF "$base" /tmp/simple.html; then
              echo "skip (already present): $base"
            else
              echo "will publish: $base"
              cp "$path" /tmp/to-publish/
              count=$((count + 1))
            fi
          done
          echo "missing_count=${count}" >> "$GITHUB_OUTPUT"
          if [ "$count" -eq 0 ]; then
            echo "::notice::all artifacts already on the registry; skipping upload"
          fi

      - name: upload missing files to Gitea
        if: steps.missing.outputs.missing_count != '0'
        env:
          UV_PUBLISH_URL: ${{ vars.PYPI_CUSTOM_URL }}
          UV_PUBLISH_USERNAME: ${{ secrets.PYPI_CUSTOM_USERNAME }}
          UV_PUBLISH_PASSWORD: ${{ secrets.PYPI_CUSTOM_PASSWORD }}
        run: |
          set -euo pipefail
          # Trailing slash required by Gitea's PyPI API.
          uv publish --publish-url "${UV_PUBLISH_URL%/}/" /tmp/to-publish/*

  github-release:
    name: GitHub Release
    needs: [linux, macos, windows, sdist, smoke, version-gate]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true
      - name: list artifacts
        run: ls -la dist/
      - name: create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version-gate.outputs.version }}
          name: v${{ needs.version-gate.outputs.version }}
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
          body: |
            Streaming age passphrase encrypt/decrypt for Python.

            Install from the family index (preferred for l3io packages):

            ```shell
            uv pip install l3io-age-passphrase \
              --index-url https://git.ravenwolf.org/api/packages/liquidlogiclabs/pypi/simple/
            ```

            Or grab a platform wheel from the assets below.

            See the [README](https://github.com/${{ github.repository }}#readme) for API docs.
            Public PyPI publish is not enabled yet.
