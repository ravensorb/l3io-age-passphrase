# Cut a release: bump version files, tag, hand off to Publish.
#
#   gh workflow run release.yml -f bump=patch
#   gh workflow run release.yml -f bump=minor
#   gh workflow run release.yml -f bump=major

name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to increment
        type: choice
        options: [patch, minor, major]
        default: patch

permissions: {}

jobs:
  tag:
    name: ${{ inputs.bump }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }

      - name: compute next version
        id: next
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          current=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          IFS=. read -r major minor patch <<<"$current"
          case "$BUMP" in
            patch) next="${major}.${minor}.$((patch + 1))" ;;
            minor) next="${major}.$((minor + 1)).0" ;;
            major) next="$((major + 1)).0.0" ;;
            *) echo "::error::unknown bump"; exit 1 ;;
          esac
          # First release may already be 0.1.0 untagged — allow tagging current
          # when no v*.*.* tag exists and bump would skip the declared version.
          if ! git rev-parse -q --verify "refs/tags/v${current}" >/dev/null \
             && [ -z "$(git tag -l 'v*.*.*')" ]; then
            echo "::notice::no release tags yet; tagging current ${current}"
            next="$current"
          fi
          echo "current=${current}" >> "$GITHUB_OUTPUT"
          echo "version=${next}" >> "$GITHUB_OUTPUT"
          echo "${current} + ${BUMP} -> ${next}"

      - name: the tag must not already exist
        env:
          NEXT: v${{ steps.next.outputs.version }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/${NEXT}" >/dev/null; then
            echo "::error::${NEXT} already exists"
            exit 1
          fi

      - name: bump version files when needed
        if: steps.next.outputs.current != steps.next.outputs.version
        env:
          NEXT: ${{ steps.next.outputs.version }}
        run: |
          set -euo pipefail
          sed -i "0,/^version = /s/^version = \".*\"/version = \"${NEXT}\"/" Cargo.toml
          sed -i "0,/^version = /s/^version = \".*\"/version = \"${NEXT}\"/" pyproject.toml
          grep -n '^version = ' Cargo.toml pyproject.toml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml pyproject.toml
          git commit -m "chore: release v${NEXT}"
          git push origin HEAD:${{ github.ref_name }}

      - name: create the tag
        uses: LiquidLogicLabs/git-action-tag-create-update@v2
        with:
          tag-name: v${{ steps.next.outputs.version }}
          tag-message: |
            l3io-age-passphrase v${{ steps.next.outputs.version }}

            ${{ inputs.bump }} release from ${{ github.sha }}.
          update-existing: "false"
          force: "false"

      - name: hand the new tag to Publish
        uses: LiquidLogicLabs/git-action-trigger-workflow@v2
        with:
          workflow-name: Publish
          ref: v${{ steps.next.outputs.version }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: summary
        run: |
          {
            echo "### Tagged v${{ steps.next.outputs.version }}"
            echo
            echo "Publish is building multi-platform wheels for the GitHub Release."
          } >> "$GITHUB_STEP_SUMMARY"
