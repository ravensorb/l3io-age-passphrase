# CI for l3io-age-passphrase: lint, build the extension, run tests.
# Publishing lives in publish.yml (tag / release only).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.11.6"
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run ruff check tests
      - run: uv run ruff format --check tests

  test:
    name: test · ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.11.6"
          enable-cache: true
          python-version: ${{ matrix.python }}
      - name: install FiloSottile age (for interop tests)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/age.tgz \
            https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz
          tar -xzf /tmp/age.tgz -C /tmp
          sudo install -m 755 /tmp/age/age /tmp/age/age-plugin-batchpass /usr/local/bin/
          age --version
      - run: uv sync --group dev
      - name: build extension into the venv
        run: uv run maturin develop --uv --release
      - name: pytest
        run: uv run pytest

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
